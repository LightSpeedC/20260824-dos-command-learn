<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="set を通過したときの終了コードの違い（.bat と .cmd）">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(280,78%,25%)"/>
				<stop offset="1" stop-color="hsl(280,58%,55%)"/>
			</linearGradient>
			<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(0,78%,25%)"/>
				<stop offset="1" stop-color="hsl(0,58%,55%)"/>
			</linearGradient>
			<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(140,78%,25%)"/>
				<stop offset="1" stop-color="hsl(140,58%,55%)"/>
			</linearGradient>
			<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<rect x="20" y="60" width="240" height="80" rx="10" fill="url(#i1)"/>
		<text x="140" y="95" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">call :fail</text>
		<text x="140" y="120" fill="#fff" font-size="13" text-anchor="middle">終了コード 1</text>
		<text x="420" y="45" fill="#4a5568" font-size="13" text-anchor="middle">set FOO=bar を通過</text>
		<line x1="265" y1="85" x2="585" y2="50" stroke="#4a5568" stroke-width="2" marker-end="url(#i4)"/>
		<line x1="265" y1="115" x2="585" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#i4)"/>
		<rect x="595" y="15" width="380" height="70" rx="10" fill="url(#i2)"/>
		<text x="785" y="45" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">.bat — 1 のまま</text>
		<text x="785" y="70" fill="#fff" font-size="13" text-anchor="middle">失敗の記録が残り続ける</text>
		<rect x="595" y="115" width="380" height="70" rx="10" fill="url(#i3)"/>
		<text x="785" y="145" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">.cmd — 0 に戻る</text>
		<text x="785" y="170" fill="#fff" font-size="13" text-anchor="middle">set の成功で上書きされる</text>
	</svg>
