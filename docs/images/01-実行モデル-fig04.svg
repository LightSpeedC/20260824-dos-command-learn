<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="失敗しても次の行が実行される流れと、|| で止める流れ">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(140,78%,25%)"/>
				<stop offset="1" stop-color="hsl(140,58%,55%)"/>
			</linearGradient>
			<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(0,78%,25%)"/>
				<stop offset="1" stop-color="hsl(0,58%,55%)"/>
			</linearGradient>
			<marker id="i3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<text x="20" y="30" fill="#4a5568" font-size="14" font-weight="bold">何も書かない場合</text>
		<rect x="20" y="45" width="260" height="60" rx="10" fill="url(#i2)"/>
		<text x="150" y="82" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">copy 失敗（ERRORLEVEL=1）</text>
		<rect x="370" y="45" width="260" height="60" rx="10" fill="url(#i2)"/>
		<text x="500" y="82" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">del が実行される</text>
		<rect x="720" y="45" width="260" height="60" rx="10" fill="url(#i2)"/>
		<text x="850" y="82" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">「完了しました」</text>
		<line x1="285" y1="75" x2="362" y2="75" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>
		<line x1="635" y1="75" x2="712" y2="75" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>
		<text x="20" y="150" fill="#4a5568" font-size="14" font-weight="bold">|| を付けた場合</text>
		<rect x="20" y="165" width="260" height="60" rx="10" fill="url(#i2)"/>
		<text x="150" y="202" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">copy 失敗（ERRORLEVEL=1）</text>
		<rect x="370" y="165" width="260" height="60" rx="10" fill="url(#i1)"/>
		<text x="500" y="202" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">|| ( … exit /b 1 )</text>
		<line x1="285" y1="195" x2="362" y2="195" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>
		<text x="720" y="202" fill="#4a5568" font-size="14">ここで終了し、del は実行されない</text>
	</svg>
