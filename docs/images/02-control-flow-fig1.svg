<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="通常展開と遅延展開の違い" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>

		<defs>
			<linearGradient id="g-04-1a" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(280,78%,25%)"/>
				<stop offset="1" stop-color="hsl(280,58%,65%)"/>
			</linearGradient>
			<linearGradient id="g-04-1b" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(0,78%,25%)"/>
				<stop offset="1" stop-color="hsl(0,58%,65%)"/>
			</linearGradient>
			<marker id="m-04-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>

		<text x="245" y="22" fill="#4a5568" font-size="14" font-weight="bold" text-anchor="middle">%count% — 通常の展開</text>
		<rect x="20" y="35" width="450" height="60" rx="8" fill="url(#g-04-1a)"/>
		<text x="245" y="60" fill="#fff" font-size="13" text-anchor="middle">ブロックに入る前に、全体を1回だけ置換</text>
		<text x="245" y="82" fill="#fff" font-size="13" text-anchor="middle">この時点の値 0 が3回分すべてに焼き付く</text>

		<line x1="245" y1="100" x2="245" y2="128" stroke="#4a5568" stroke-width="2" marker-end="url(#m-04-1)"/>

		<rect x="20" y="135" width="450" height="120" rx="8" fill="#f4f6fa" stroke="#d9dfe8"/>
		<text x="40" y="162" fill="#1c2330" font-size="13" font-family="monospace">1周目: echo 現在: 0</text>
		<text x="40" y="188" fill="#1c2330" font-size="13" font-family="monospace">2周目: echo 現在: 0</text>
		<text x="40" y="214" fill="#1c2330" font-size="13" font-family="monospace">3周目: echo 現在: 0</text>
		<text x="40" y="242" fill="#a51f22" font-size="12">値は増えているが、表示は焼き付いた 0</text>

		<text x="755" y="22" fill="#4a5568" font-size="14" font-weight="bold" text-anchor="middle">!count! — 遅延展開</text>
		<rect x="530" y="35" width="450" height="60" rx="8" fill="url(#g-04-1b)"/>
		<text x="755" y="60" fill="#fff" font-size="13" text-anchor="middle">ブロック展開時には置換されない</text>
		<text x="755" y="82" fill="#fff" font-size="13" text-anchor="middle">各周の実行直前に、その時点の値を差し込む</text>

		<line x1="755" y1="100" x2="755" y2="128" stroke="#4a5568" stroke-width="2" marker-end="url(#m-04-1)"/>

		<rect x="530" y="135" width="450" height="120" rx="8" fill="#f4f6fa" stroke="#d9dfe8"/>
		<text x="550" y="162" fill="#1c2330" font-size="13" font-family="monospace">1周目: echo 現在: 1</text>
		<text x="550" y="188" fill="#1c2330" font-size="13" font-family="monospace">2周目: echo 現在: 2</text>
		<text x="550" y="214" fill="#1c2330" font-size="13" font-family="monospace">3周目: echo 現在: 3</text>
		<text x="550" y="242" fill="#1d7a3c" font-size="12">実行のたびに評価されるので期待どおり</text>

		<text x="500" y="285" fill="#4a5568" font-size="12" text-anchor="middle">遅延展開を使うには setlocal enabledelayedexpansion が必要（既定では無効）</text>
	
</svg>