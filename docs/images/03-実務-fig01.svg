<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 130" width="760" height="130" role="img" aria-label="自分の環境で動く段階から、他人に渡せる段階へ"><defs><linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient><marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4a5568"/></marker></defs>
	<rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="30" width="200" height="70" rx="8" fill="url(#i1)"/><text x="120" y="60" text-anchor="middle" font-size="14" fill="#fff">動く</text><text x="120" y="80" text-anchor="middle" font-size="14" fill="#fff">自分の PC・自分が実行</text><line x1="222" y1="65" x2="276" y2="65" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/><rect x="280" y="30" width="200" height="70" rx="8" fill="url(#i1)"/><text x="380" y="60" text-anchor="middle" font-size="14" fill="#fff">渡す</text><text x="380" y="80" text-anchor="middle" font-size="14" fill="#fff">他人の PC・タスクスケジューラ</text><line x1="482" y1="65" x2="536" y2="65" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/><rect x="540" y="30" width="200" height="70" rx="8" fill="url(#i1)"/><text x="640" y="60" text-anchor="middle" font-size="14" fill="#fff">壊れない</text><text x="640" y="80" text-anchor="middle" font-size="14" fill="#fff">環境の前提を固定する</text></svg>
