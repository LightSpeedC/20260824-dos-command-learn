<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="call でサブルーチンへ飛び、goto :eof で戻る流れ">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(105,78%,25%)"/>
				<stop offset="1" stop-color="hsl(105,58%,55%)"/>
			</linearGradient>
			<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<rect x="20" y="20" width="340" height="150" rx="8" fill="url(#i1)"/>
		<text x="190" y="50" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">メイン処理</text>
		<text x="45" y="85" fill="#fff" font-size="14" font-family="monospace">call :log "開始"</text>
		<text x="45" y="115" fill="#fff" font-size="14" font-family="monospace">echo 次の処理</text>
		<text x="45" y="145" fill="#fff" font-size="14" font-family="monospace">goto :eof</text>
		<rect x="640" y="20" width="340" height="150" rx="8" fill="url(#i1)"/>
		<text x="810" y="50" fill="#fff" font-size="15" font-weight="bold" text-anchor="middle">サブルーチン</text>
		<text x="665" y="85" fill="#fff" font-size="14" font-family="monospace">:log</text>
		<text x="665" y="115" fill="#fff" font-size="14" font-family="monospace">echo %~1</text>
		<text x="665" y="145" fill="#fff" font-size="14" font-family="monospace">goto :eof</text>
		<line x1="365" y1="80" x2="635" y2="80" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<text x="500" y="70" fill="#4a5568" font-size="13" text-anchor="middle">call で飛ぶ（引数は %~1 で受ける）</text>
		<line x1="635" y1="140" x2="365" y2="112" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<text x="500" y="155" fill="#4a5568" font-size="13" text-anchor="middle">goto :eof で呼び出し元の次の行へ戻る</text>
	</svg>
