<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="括弧ブロックが実行されるまでの流れ">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(280,78%,25%)"/>
				<stop offset="1" stop-color="hsl(280,58%,55%)"/>
			</linearGradient>
			<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<rect x="20" y="30" width="280" height="80" rx="8" fill="url(#i1)"/>
		<text x="160" y="64" fill="#fff" font-size="15" text-anchor="middle">( 〜 ) 全体を</text>
		<text x="160" y="88" fill="#fff" font-size="15" text-anchor="middle">1つの論理行として読む</text>
		<line x1="305" y1="70" x2="355" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="360" y="30" width="280" height="80" rx="8" fill="url(#i1)"/>
		<text x="500" y="64" fill="#fff" font-size="15" text-anchor="middle">中の %VAR% を</text>
		<text x="500" y="88" fill="#fff" font-size="15" text-anchor="middle">一度にすべて置換</text>
		<line x1="645" y1="70" x2="695" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="700" y="30" width="280" height="80" rx="8" fill="url(#i1)"/>
		<text x="840" y="64" fill="#fff" font-size="15" text-anchor="middle">確定した中身を</text>
		<text x="840" y="88" fill="#fff" font-size="15" text-anchor="middle">繰り返し実行</text>
		<text x="500" y="138" fill="#4a5568" font-size="13" text-anchor="middle">置換はループの前に1回だけ。ループ中に値が変わっても、置換済みの文字列は変わらない</text>
	</svg>
