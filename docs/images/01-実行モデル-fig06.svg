		<line x1="382" y1="70" x2="404" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>
		<line x1="582" y1="70" x2="604" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>
