<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="拡張子ごとに振り分けてコピーする流れ">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(35,78%,25%)"/>
				<stop offset="1" stop-color="hsl(35,58%,55%)"/>
			</linearGradient>
			<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<rect x="20" y="60" width="240" height="80" rx="8" fill="url(#i1)"/>
		<text x="140" y="94" fill="#fff" font-size="15" text-anchor="middle">対象フォルダの</text>
		<text x="140" y="118" fill="#fff" font-size="15" text-anchor="middle">ファイルを1つずつ</text>
		<line x1="265" y1="100" x2="325" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="330" y="60" width="260" height="80" rx="8" fill="url(#i1)"/>
		<text x="460" y="94" fill="#fff" font-size="15" text-anchor="middle">拡張子を取り出す</text>
		<text x="460" y="118" fill="#fff" font-size="13" text-anchor="middle">空なら noext（置換より先に判定）</text>
		<line x1="595" y1="85" x2="695" y2="40" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<line x1="595" y1="100" x2="695" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<line x1="595" y1="115" x2="695" y2="160" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="700" y="15" width="280" height="46" rx="8" fill="url(#i1)"/>
		<text x="840" y="44" fill="#fff" font-size="14" font-family="monospace" text-anchor="middle">sorted\txt\</text>
		<rect x="700" y="77" width="280" height="46" rx="8" fill="url(#i1)"/>
		<text x="840" y="106" fill="#fff" font-size="14" font-family="monospace" text-anchor="middle">sorted\log\</text>
