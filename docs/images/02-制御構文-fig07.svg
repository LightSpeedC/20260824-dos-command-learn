<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="1行が解釈される順番">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(70,78%,25%)"/>
				<stop offset="1" stop-color="hsl(70,58%,55%)"/>
			</linearGradient>
			<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
				<path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
			</marker>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<rect x="20" y="20" width="200" height="80" rx="8" fill="url(#i1)"/>
		<text x="120" y="54" fill="#fff" font-size="15" text-anchor="middle">1. % の展開</text>
		<text x="120" y="80" fill="#fff" font-size="13" font-family="monospace" text-anchor="middle">%VAR% %1 %%</text>
		<line x1="225" y1="60" x2="275" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="280" y="20" width="200" height="80" rx="8" fill="url(#i1)"/>
		<text x="380" y="54" fill="#fff" font-size="15" text-anchor="middle">2. ^ の処理</text>
		<text x="380" y="80" fill="#fff" font-size="13" font-family="monospace" text-anchor="middle">^&amp; ^^</text>
		<line x1="485" y1="60" x2="535" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="540" y="20" width="200" height="80" rx="8" fill="url(#i1)"/>
		<text x="640" y="54" fill="#fff" font-size="15" text-anchor="middle">3. ! の展開</text>
		<text x="640" y="80" fill="#fff" font-size="13" font-family="monospace" text-anchor="middle">!VAR!</text>
		<line x1="745" y1="60" x2="775" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
		<rect x="780" y="20" width="200" height="80" rx="8" fill="url(#i1)"/>
		<text x="880" y="54" fill="#fff" font-size="15" text-anchor="middle">4. 解析・実行</text>
		<text x="880" y="80" fill="#fff" font-size="13" font-family="monospace" text-anchor="middle">&amp; | &gt; で分割</text>
		<text x="500" y="122" fill="#4a5568" font-size="13" text-anchor="middle">^! は 2 で ^ が消費され、3 で ! が展開される。だから ^^! が必要</text>
	</svg>
