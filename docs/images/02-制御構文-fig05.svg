<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="abcdefg の位置と部分取得">
		<defs>
			<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
				<stop offset="0" stop-color="hsl(140,78%,25%)"/>
				<stop offset="1" stop-color="hsl(140,58%,55%)"/>
			</linearGradient>
		</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>
		<text x="150" y="40" fill="#4a5568" font-size="13" text-anchor="end">先頭からの位置</text>
		<text x="150" y="168" fill="#4a5568" font-size="13" text-anchor="end">末尾からの位置</text>
		<g font-size="13" fill="#4a5568" text-anchor="middle">
			<text x="215" y="40">0</text><text x="305" y="40">1</text><text x="395" y="40">2</text><text x="485" y="40">3</text><text x="575" y="40">4</text><text x="665" y="40">5</text><text x="755" y="40">6</text>
			<text x="215" y="168">-7</text><text x="305" y="168">-6</text><text x="395" y="168">-5</text><text x="485" y="168">-4</text><text x="575" y="168">-3</text><text x="665" y="168">-2</text><text x="755" y="168">-1</text>
		</g>
		<rect x="175" y="55" width="80" height="80" rx="8" fill="url(#i1)"/>
		<rect x="265" y="55" width="80" height="80" rx="8" fill="url(#i1)"/>
		<rect x="355" y="55" width="80" height="80" rx="8" fill="url(#i1)"/>
		<rect x="445" y="55" width="80" height="80" rx="8" fill="#f4f6fa" stroke="#d9dfe8"/>
		<rect x="535" y="55" width="80" height="80" rx="8" fill="#f4f6fa" stroke="#d9dfe8"/>
		<rect x="625" y="55" width="80" height="80" rx="8" fill="#f4f6fa" stroke="#d9dfe8"/>
		<rect x="715" y="55" width="80" height="80" rx="8" fill="#f4f6fa" stroke="#d9dfe8"/>
		<g font-size="26" font-family="monospace" text-anchor="middle">
			<text x="215" y="104" fill="#fff">a</text><text x="305" y="104" fill="#fff">b</text><text x="395" y="104" fill="#fff">c</text>
			<text x="485" y="104" fill="#1c2330">d</text><text x="575" y="104" fill="#1c2330">e</text><text x="665" y="104" fill="#1c2330">f</text><text x="755" y="104" fill="#1c2330">g</text>
		</g>
		<text x="820" y="92" fill="#1c2330" font-size="14" font-family="monospace">%V:~0,3%</text>
		<text x="820" y="114" fill="#1c2330" font-size="14">= abc</text>
		<text x="500" y="194" fill="#4a5568" font-size="13" text-anchor="middle">~開始,文字数。開始と文字数に負の値を使うと末尾から数える</text>
	</svg>
