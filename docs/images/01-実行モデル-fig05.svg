		<text x="250" y="172" fill="#4a5568" font-size="14" text-anchor="middle">%~dp1（%~dp0 はこの部分を自分自身から取る）</text>
		<line x1="490" y1="148" x2="980" y2="148" stroke="#4a5568" stroke-width="2"/>
