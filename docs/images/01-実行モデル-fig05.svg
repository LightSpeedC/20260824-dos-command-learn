		<text x="615" y="77" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">input</text>
		<rect x="750" y="40" width="230" height="60" rx="10" fill="url(#i4)"/>
		<text x="865" y="77" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">.txt</text>
		<text x="80" y="128" fill="#4a5568" font-size="14" text-anchor="middle">%~d1</text>
